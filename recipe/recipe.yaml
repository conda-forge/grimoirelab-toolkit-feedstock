schema_version: 1

context:
  version: "1.2.6"

package:
  name: grimoirelab-toolkit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/grimoirelab-toolkit/grimoirelab_toolkit-${{ version }}.tar.gz
  sha256: abf00dc16f67a7a2cd0400e5ce1e36e8b705e28b026884fd969cea3a4b4225ed

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - python-dateutil >=2.8.2,<3.0.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - grimoirelab_toolkit
      pip_check: true

about:
  summary: Toolkit of common functions used across GrimoireLab
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://chaoss.github.io/grimoirelab/

extra:
  recipe-maintainers:
    - travishathaway
